version: 2.1

jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout

      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-frontapp
            source /usr/local/share/virtualenvs/tap-frontapp/bin/activate
            uv pip install -U setuptools
            uv pip install .[dev]
      - add_ssh_keys
      - run:
          name: "JSON Validator"
          command: |
            source /usr/local/share/virtualenvs/tap-frontapp/bin/activate
            stitch-validate-json tap_frontapp/schemas/*.json
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-frontapp/bin/activate
            uv pip install pylint
            pylint tap_frontapp -d C,R,W
      - run:
          name: "Unit Tests"
          command: |
            source /usr/local/share/virtualenvs/tap-frontapp/bin/activate
            uv pip install pytest coverage parameterized
            coverage run -m pytest tests/unittests
            coverage html
          when: always
      - run:
          name: "Integration Tests"
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            uv pip install --upgrade awscli
            aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
            source dev_env.sh
            unset USE_STITCH_BACKEND
            uv pip install -e .
            run-test --tap=tap-frontapp tests

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
